[remote.github]
owner = "DoubledDoge"
repo = "split-happens"

[changelog]
header = ""
body = """
## What's Changed\n
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true
footer = "{% if previous.version %}**Full Changelog**: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}/compare/{{ previous.version }}...{{ version }}{% endif %}"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { breaking = true,       group = "Breaking Changes" },
    { message = "^feat",     group = "Features" },
    { message = "^fix",      group = "Bug Fixes" },
    { message = "^perf",     group = "Performance" },
    { message = "^docs",     group = "Documentation" },
    { message = "^style",    group = "Styling & Theming" },
    { message = "^test",     group = "Tests" },
    { message = "^chore|^refactor|^build|^ci", group = "Maintenance" },
    { message = ".*",        group = "Other" }
]
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"