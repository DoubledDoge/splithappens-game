name: Android CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.extract.outputs.version }}
      version-code: ${{ steps.extract.outputs.version-code }}
      is-prerelease: ${{ steps.extract.outputs.is-prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Extract version from tag
        id: extract
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if ! [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version format: $VERSION"
            exit 1
          fi

          if [[ $VERSION =~ - ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi

          BASE_VERSION=${VERSION%%-*}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE_VERSION"
          if (( MINOR > 99 || PATCH > 99 )); then
            echo "::error::Minor and patch must be <= 99 for the version code scheme"
            exit 1
          fi
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version-code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

  package-apk:
    name: Package APK
    runs-on: ubuntu-latest
    needs: validate-tag
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: enhanced

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :splithappens:testDebugUnitTest

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SPLITHAPPENS_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/splithappens-release.jks"

      - name: Build signed release APK
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/splithappens-release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SPLITHAPPENS_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SPLITHAPPENS_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SPLITHAPPENS_KEY_PASSWORD }}
        run: |
          ./gradlew :splithappens:assembleRelease \
            -PversionName=${{ needs.validate-tag.outputs.version }} \
            -PversionCode=${{ needs.validate-tag.outputs.version-code }}

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose splithappens/build/outputs/apk/release/*.apk

      - name: Stage APK for release
        run: |
          mkdir -p ./artifacts
          cp splithappens/build/outputs/apk/release/*.apk \
            ./artifacts/SplitHappens-${{ needs.validate-tag.outputs.version }}.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: splithappens-apk-${{ github.sha }}
          path: ./artifacts/*.apk
          retention-days: 1

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/splithappens-release.jks"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ validate-tag, package-apk ]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: splithappens-apk-${{ github.sha }}
          path: ./artifacts

      - name: Generate changelog
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: .github/cliff.toml
          args: --verbose --latest --strip header
        env:
          GITHUB_REPO: ${{ github.repository }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.cliff.outputs.content }}
          draft: false
          prerelease: ${{ needs.validate-tag.outputs.is-prerelease == 'true' }}
          files: ./artifacts/*.apk